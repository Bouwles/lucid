# Appendix A starting point.
base: ../model/small.yaml
run_name: small_runner_v1
seed: 0
data:
  version: runner_v1
  games: [runner]
  mixture: equal_per_game
  resolution: [64, 64]
  context_frames: 4
  action_history: true
  frame_skip: 4
model:
  num_games: 1
  sigma_data: 0.5
  p_uncond_action: 0.1
context_noise:
  p_clean: 0.2
  max_sigma: 0.7
train:
  batch_size: 64
  lr: 2.0e-4
  warmup_steps: 1000
  max_steps: 100000
  ema_decay: 0.9995
  grad_clip: 1.0
  precision: bf16
  val_every: 2000
  ckpt_every: 5000
sampler:
  type: euler
  steps: 3
  sigma_min: 0.002
  sigma_max: 80
  rho: 7
  inference_context_noise: 0.1
  refinement: false
