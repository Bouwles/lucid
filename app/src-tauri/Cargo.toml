[package]
name = "lucid"
version = "0.3.0"
description = "LUCID desktop app: play games and their dreams"
authors = ["Paul Nercessian"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lucid_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
