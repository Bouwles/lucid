[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid"
version = "0.0.1"
description = "A neural game engine that learns to dream the games you make."
authors = [{ name = "Paul Nercessian" }]
license = { text = "MIT" }
requires-python = ">=3.11"
# Lower bounds are the versions this was first tested with (see docs/hardware.md).
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "tqdm>=4.66",
  "tensorboard>=2.16",
  "torchmetrics>=1.4",
  "lpips>=0.1.4",
  "imageio>=2.34",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
play = ["pygame>=2.5"]
export = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
include = ["lucid*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["recorder", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU, skipped in CI"]

[tool.ruff.lint.isort]
known-first-party = ["lucid"]
known-local-folder = ["conftest", "test_engine"]
