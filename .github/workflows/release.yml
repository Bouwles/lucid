name: release

# Builds the desktop app for macOS, Windows and Linux, smoke-tests each build, and keeps the
# installers as artefacts. Pushing a tag like v0.2.0 also attaches them to a draft GitHub
# release, which stays private until it's published by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "LUCID $GITHUB_REF_NAME" \
            --notes "Unsigned builds. On macOS, right-click the app and choose Open the first time. On Windows, choose More info, then Run anyway."

  build:
    needs: [draft]
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the engine sidecar
        run: python engine/build_sidecar.py

      - name: Fetch the bundled dream packs
        run: python scripts/fetch_dream_pack.py --list app/src-tauri/resources/models/packs.json

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        if: runner.os != 'macOS'
        working-directory: app
        run: npx tauri build

      # Tauri's DMG script drives Finder, which fails on headless runners, so the Mac job builds
      # the .app and packs the disk image with hdiutil instead.
      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npx tauri build --bundles app
          mkdir -p src-tauri/target/release/bundle/dmg
          hdiutil create -volname LUCID -srcfolder src-tauri/target/release/bundle/macos/LUCID.app \
            -ov -format UDZO src-tauri/target/release/bundle/dmg/LUCID_0.2.0_aarch64.dmg

      - name: Smoke test
        run: python scripts/smoke_app.py

      - name: Keep the installers
        uses: actions/upload-artifact@v5
        with:
          name: lucid-${{ matrix.label }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(app/src-tauri/target/release/bundle/dmg/*.dmg app/src-tauri/target/release/bundle/msi/*.msi \
                 app/src-tauri/target/release/bundle/nsis/*.exe app/src-tauri/target/release/bundle/appimage/*.AppImage \
                 app/src-tauri/target/release/bundle/deb/*.deb)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
